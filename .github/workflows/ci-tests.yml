name: CI — Integration & E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    name: Run integration + E2E tests
    runs-on: ubuntu-latest
    env:
      QDRANT_URL: http://localhost:6333
      GEMINI_API_KEY: DUMMY_API_KEY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Start Qdrant container (explicit docker run)
        run: |
          echo "Pulling Qdrant image..."
          docker pull qdrant/qdrant:v1.15.1
          echo "Starting Qdrant container..."
          docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:v1.15.1
          docker ps -a

      - name: Wait for Qdrant
        run: |
          echo "Waiting for Qdrant to be ready (manual polling)..."
          for i in {1..60}; do
            if curl -sSf http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is ready"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          echo "Qdrant did not become ready in time" && docker logs qdrant || true && exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core dependencies used by tests. Use binaries where available.
          pip install --prefer-binary qdrant-client llama-index fastapi uvicorn pydantic streamlit requests pytest -q

      - name: Run integration tests
        run: |
          python -m pip list
          python -u test_integration.py

      - name: Run E2E audit test
        run: |
          python -u src/test_e2e_audit.py

      - name: Run seeded/unseeded test paths
        run: |
          python -u src/test_seeded_paths.py

      - name: Dump Qdrant logs (on failure)
        if: ${{ failure() }}
        run: |
          echo "==== QDRANT CONTAINER STATUS ===="
          docker ps -a || true
          echo "==== QDRANT LOGS (tail 400 lines) ===="
          docker logs --tail 400 qdrant || true

      - name: Upload audit logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: audit_logs/

      - name: Stop Qdrant container
        if: always()
        run: |
          echo "Stopping and removing qdrant container (if present)"
          docker ps -a
          docker stop qdrant || true
          docker rm qdrant || true
