name: CI — Integration & E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    name: Run integration + E2E tests
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -sSf http://localhost:6333/collections || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      QDRANT_URL: http://localhost:6333
      GEMINI_API_KEY: DUMMY_API_KEY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Wait for Qdrant
        run: |
          echo "Waiting for Qdrant to be ready..."
          for i in {1..30}; do
            if curl -sSf http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is ready"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          echo "Qdrant did not become ready in time" && exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core dependencies used by tests. Use binaries where available.
          pip install --prefer-binary qdrant-client llama-index fastapi uvicorn pydantic streamlit requests pytest -q

      - name: Run integration tests
        run: |
          python -m pip list
          python -u test_integration.py

      - name: Run E2E audit test
        run: |
          python -u src/test_e2e_audit.py

      - name: Run seeded/unseeded test paths
        run: |
          python -u src/test_seeded_paths.py

      - name: Upload audit logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: audit_logs/
